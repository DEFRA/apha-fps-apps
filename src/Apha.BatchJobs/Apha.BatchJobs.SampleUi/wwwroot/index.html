<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecreateSummaries Demo UI</title>
    <style>
        :root {
            --bg-a: #edf3ff;
            --bg-b: #f8f2e9;
            --card: #ffffff;
            --ink-1: #132235;
            --ink-2: #506579;
            --line: #cdd8e8;
            --accent-a: #005dc1;
            --accent-b: #0077f0;
            --ready-bg: #eef5ff;
            --ready-ink: #2a5b9d;
            --active-bg: #edf4ff;
            --active-ink: #1b549f;
            --running-bg: #e8faf5;
            --running-ink: #0d6a52;
            --ok-bg: #e9f8ef;
            --ok-ink: #16693c;
            --bad-bg: #fdecef;
            --bad-ink: #9f1d2f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
            color: var(--ink-1);
            background:
                radial-gradient(circle at 8% 6%, #dceafe 0%, transparent 35%),
                radial-gradient(circle at 92% 10%, #ffe7c7 0%, transparent 30%),
                linear-gradient(180deg, var(--bg-a), var(--bg-b));
            min-height: 100vh;
            padding: 24px 14px;
        }

        .page {
            max-width: 980px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 16px 36px rgba(16, 45, 80, 0.11);
            overflow: hidden;
        }

        .hero {
            padding: 22px 20px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(120deg, #f3f8ff 0%, #f8f2e6 100%);
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .sub {
            margin: 8px 0 0;
            color: var(--ink-2);
            font-size: 15px;
        }

        .main {
            padding: 18px 20px 20px;
            display: grid;
            gap: 12px;
        }

        .card {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fcfdff;
            padding: 12px;
        }

        .row {
            display: grid;
            grid-template-columns: 120px 1fr;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .row:last-child { margin-bottom: 0; }

        label {
            color: var(--ink-2);
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            border: 1px solid #bcd;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
        }

        .status-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 10px;
            border: 1px solid transparent;
        }

        .state-ready { background: var(--ready-bg); color: var(--ready-ink); border-color: #c9ddfd; }
        .state-submitting, .state-accepted { background: var(--active-bg); color: var(--active-ink); border-color: #b9d3fa; }
        .state-running { background: var(--running-bg); color: var(--running-ink); border-color: #b3ebdd; }
        .state-completed { background: var(--ok-bg); color: var(--ok-ink); border-color: #bfe8cd; }
        .state-failed, .state-timeout, .state-delivery { background: var(--bad-bg); color: var(--bad-ink); border-color: #f1c2cc; }

        .action {
            border: 1px solid transparent;
            background: linear-gradient(120deg, var(--accent-a), var(--accent-b));
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            border-radius: 8px;
            padding: 9px 14px;
            cursor: pointer;
            min-width: 180px;
        }

        .action-secondary {
            border: 1px solid #9bb8dd;
            background: #eff5ff;
            color: #1f4e86;
            font-weight: 700;
            font-size: 14px;
            border-radius: 8px;
            padding: 9px 14px;
            cursor: pointer;
            min-width: 180px;
        }

        .scenario-wrap {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin-top: 8px;
        }

        select {
            width: 100%;
            border: 1px solid #bcd;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
            background: #fff;
        }

        .action[disabled] { opacity: 0.6; cursor: not-allowed; }

        .meta {
            margin-top: 8px;
            color: var(--ink-2);
            font-size: 13px;
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
        }

        .panel-title {
            background: #eff5ff;
            border-bottom: 1px solid var(--line);
            color: #2a4560;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.4px;
            padding: 9px 10px;
            text-transform: uppercase;
        }

        pre {
            margin: 0;
            background: #091525;
            color: #dce8fa;
            padding: 10px;
            min-height: 180px;
            max-height: 260px;
            overflow: auto;
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.35;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .spinner {
            width: 11px;
            height: 11px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            margin-right: 6px;
            animation: spin 0.75s linear infinite;
        }

        @media (max-width: 900px) {
            h1 { font-size: 24px; }
            .panels { grid-template-columns: 1fr; }
            .row { grid-template-columns: 1fr; }
            .action { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="page">
        <section class="hero">
            <h1>RecreateSummaries Demo Console</h1>
            <p class="sub">Dedicated demo UI for RecreateSummaries only. Main UX shows run-level status (Running/Completed/Failed), not per-step state.</p>
        </section>

        <section class="main">
            <div class="card">
                <div class="row">
                    <label for="requestedBy">Requested By</label>
                    <input id="requestedBy" value="sample-ui@local" />
                </div>

                <div class="status-wrap">
                    <span id="statusPill" class="status-pill state-ready">Ready</span>
                    <button id="triggerBtn" class="action">Trigger RecreateSummaries</button>
                </div>

                <div class="scenario-wrap">
                    <select id="scenarioSelect" aria-label="Select scenario to preview">
                        <option value="failed">Failed</option>
                        <option value="timeout">StartFailedTimeout</option>
                        <option value="delivery">StartFailedDeliveryExhausted</option>
                        <option value="running">Running</option>
                        <option value="completed">Completed</option>
                    </select>
                    <button id="scenarioBtn" class="action-secondary">Show Scenario</button>
                </div>

                <div id="statusMeta" class="meta">Ready to trigger via PACT API.</div>
            </div>

            <div class="panels">
                <div class="panel">
                    <div class="panel-title">UI Timeline</div>
                    <pre id="timeline">Ready.</pre>
                </div>
                <div class="panel">
                    <div class="panel-title">PACT API Raw Response</div>
                    <pre id="raw">No trigger yet.</pre>
                </div>
            </div>
        </section>
    </div>

    <script>
        const JOB_NAME = "RecreateSummaries";
        const STARTUP_WINDOW_MS = 10 * 60 * 1000;

        const timelineEl = document.getElementById("timeline");
        const rawEl = document.getElementById("raw");
        const statusPill = document.getElementById("statusPill");
        const statusMeta = document.getElementById("statusMeta");
        const triggerBtn = document.getElementById("triggerBtn");
        const scenarioBtn = document.getElementById("scenarioBtn");
        const scenarioSelect = document.getElementById("scenarioSelect");

        const timers = [];

        const STATES = {
            ready: { label: "Ready", cls: "state-ready", btn: "Trigger RecreateSummaries", disabled: false, spinning: false },
            submitting: { label: "Submitting", cls: "state-submitting", btn: "Submitting...", disabled: true, spinning: true },
            accepted: { label: "TriggerAccepted", cls: "state-accepted", btn: "Accepted", disabled: true, spinning: true },
            running: { label: "Running", cls: "state-running", btn: "Running...", disabled: true, spinning: true },
            completed: { label: "Completed", cls: "state-completed", btn: "Re-trigger RecreateSummaries", disabled: false, spinning: false },
            failed: { label: "Failed", cls: "state-failed", btn: "Retry RecreateSummaries", disabled: false, spinning: false },
            timeout: { label: "StartFailedTimeout", cls: "state-timeout", btn: "Retry RecreateSummaries", disabled: false, spinning: false },
            delivery: { label: "StartFailedDeliveryExhausted", cls: "state-delivery", btn: "Retry RecreateSummaries", disabled: false, spinning: false }
        };

        function addTimeline(text) {
            const ts = new Date().toISOString().substring(11, 19);
            timelineEl.textContent = `[${ts}] ${text}\n` + timelineEl.textContent;
        }

        function clearTimers() {
            while (timers.length) {
                clearTimeout(timers.pop());
            }
        }

        function later(ms, fn) {
            const t = setTimeout(fn, ms);
            timers.push(t);
        }

        function setState(key, metaText) {
            const s = STATES[key] || STATES.failed;
            statusPill.className = `status-pill ${s.cls}`;
            statusPill.innerHTML = s.spinning ? `<span class="spinner"></span>${s.label}` : s.label;
            triggerBtn.textContent = s.btn;
            triggerBtn.disabled = s.disabled;
            statusMeta.textContent = metaText || "";
        }

        function setRaw(statusCode, bodyText) {
            rawEl.textContent = `HTTP ${statusCode}\n${bodyText}`;
        }

        function parseUtc(value, fallback) {
            if (!value) return fallback;
            const dt = Date.parse(value);
            return Number.isNaN(dt) ? fallback : dt;
        }

        function previewScenario() {
            clearTimers();

            const key = scenarioSelect.value;
            const scenarioPayload = {
                status: STATES[key]?.label || "Unknown",
                source: "demo-scenario",
                jobName: JOB_NAME,
                timestampUtc: new Date().toISOString(),
                message: key === "failed"
                    ? "Simulated failure scenario for demo."
                    : key === "timeout"
                        ? "Simulated startup timeout before worker became visible."
                        : key === "delivery"
                            ? "Simulated exhausted delivery attempts to downstream queue."
                            : `Simulated ${STATES[key]?.label || key} scenario.`
            };

            setState(key, scenarioPayload.message);
            setRaw(200, JSON.stringify(scenarioPayload, null, 2));
            addTimeline(`Scenario preview: ${scenarioPayload.status}`);
        }

        async function triggerRecreateSummaries() {
            clearTimers();

            const requestedBy = (document.getElementById("requestedBy").value || "sample-ui@local").trim();
            setState("submitting", "Submitting trigger request to Sample UI backend...");
            addTimeline(`Trigger submitted for ${JOB_NAME} by ${requestedBy}`);

            let response;
            let bodyText = "";
            let payload = null;

            try {
                response = await fetch("/api/trigger?preferredApi=pact", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ jobName: JOB_NAME, requestedBy })
                });

                bodyText = await response.text();
                setRaw(response.status, bodyText);

                try {
                    payload = bodyText ? JSON.parse(bodyText) : null;
                } catch {
                    payload = null;
                }
            } catch (err) {
                const msg = err && err.message ? err.message : "Network request failed.";
                setRaw(0, msg);
                setState("failed", msg);
                addTimeline(`Request failed before API response (${msg})`);
                return;
            }

            if (!response.ok || !payload || payload.accepted === false) {
                const reason = payload && payload.reason ? payload.reason : "Trigger request was not accepted.";
                setState("failed", reason);
                addTimeline(`Trigger not accepted (${reason})`);
                return;
            }

            const acceptedAtMs = parseUtc(payload.acceptedAtUtc, Date.now());
            const startupDeadlineMs = parseUtc(payload.startupDeadlineUtc, acceptedAtMs + STARTUP_WINDOW_MS);

            setState("accepted", `ExecutionId ${payload.jobExecutionId || "n/a"}`);
            addTimeline(`Trigger accepted (${payload.status || "TriggerAccepted"})`);

            later(2500, () => {
                setState("running", "Execution in progress. UI shows run-level status only.");
                addTimeline("Status moved to Running");

                const now = Date.now();
                if (now >= startupDeadlineMs) {
                    setState("timeout", "Worker start not observed before startup deadline.");
                    addTimeline("Status moved to StartFailedTimeout");
                    return;
                }

                // Demo projection for local walkthrough.
                later(15000, () => {
                    setState("completed", "Completed. This demo does not display per-step statuses.");
                    addTimeline("Status moved to Completed");
                });
            });
        }

        triggerBtn.addEventListener("click", triggerRecreateSummaries);
        scenarioBtn.addEventListener("click", previewScenario);
    </script>
</body>
</html>
