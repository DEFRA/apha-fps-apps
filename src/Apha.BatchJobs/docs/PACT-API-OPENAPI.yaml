openapi: 3.0.0
info:
  title: BatchJobs PACT API
  description: |
    Canonical API contract for PACT/FPS-triggered BatchJobs execution.

    Persistent execution state is owned by BatchJobs.
    Startup projections are computed by the PACT API watchdog.
  version: 1.1.0
  contact:
    name: BatchJobs Team
  x-contractVersion: "1.1"
  x-audience: "PACT API Team, FPS API Team"

servers:
  - url: "http://localhost:5189"
    description: "Local Development"
  - url: "https://pact-api.apha.local"
    description: "Production"

paths:
  /health:
    get:
      summary: Health probe
      operationId: getHealth
      tags:
        - Operational
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/batch-jobs/catalog:
    get:
      summary: Get trigger routing catalog
      operationId: getBatchJobCatalog
      tags:
        - Catalog
      responses:
        "200":
          description: Jobs and routing capabilities for this API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"

  /api/v1/batch-jobs/trigger:
    post:
      summary: Trigger a batch job
      description: |
        Accept a trigger request, dispatch to EventBridge, and return a correlation envelope.
      operationId: triggerBatchJob
      tags:
        - Trigger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRequest"
            example:
              jobName: RecreateSummaries
              requestedBy: user@example.com
      responses:
        "202":
          description: Trigger accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerAcceptedResponse"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicFailureResponse"
        "409":
          description: Routing or policy conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicFailureResponse"
        "503":
          description: Dispatch failure before acceptance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicFailureResponse"

  /api/v1/batch-jobs/{jobName}/can-run:
    get:
      summary: Check if job can run now
      operationId: canRunBatchJob
      tags:
        - Status
      parameters:
        - $ref: "#/components/parameters/JobName"
      responses:
        "200":
          description: Advisory lock/execution pre-check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanRunResponse"
        "503":
          description: Dependency failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemLikeResponse"

  /api/v1/batch-jobs/{jobName}/status:
    get:
      summary: Get batch job status
      description: |
        Deterministic mode uses jobExecutionId query param.
        If missing or invalid, response falls back to latest-by-job-name resolution.
      operationId: getBatchJobStatus
      tags:
        - Status
      parameters:
        - $ref: "#/components/parameters/JobName"
        - name: jobExecutionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Correlation ID returned from trigger acceptance.
        - name: debugView
          in: query
          required: false
          schema:
            type: boolean
          description: Include diagnostic section in response.
      responses:
        "200":
          description: Current status and startup watchdog projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "503":
          description: Failed to query status dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemLikeResponse"

  /api/v1/batch-jobs/{jobName}/cancel:
    post:
      summary: Request cancellation
      operationId: cancelBatchJob
      tags:
        - Cancel
      parameters:
        - $ref: "#/components/parameters/JobName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
        "200":
          description: Cancellation already requested or no-op on terminal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicFailureResponse"
        "409":
          description: jobExecutionId does not match jobName
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicFailureResponse"

components:
  parameters:
    JobName:
      name: jobName
      in: path
      required: true
      schema:
        type: string
      description: Batch job name (for example RecreateSummaries)

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: pact.api
        timestamp:
          type: string
          format: date-time

    CatalogJob:
      type: object
      required:
        - jobName
        - description
        - routeKind
        - canTriggerFromThisApi
      properties:
        jobName:
          type: string
        description:
          type: string
        routeKind:
          type: string
        canTriggerFromThisApi:
          type: boolean

    CatalogResponse:
      type: object
      required:
        - api
        - jobs
      properties:
        api:
          type: string
          enum: [pact.api]
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/CatalogJob"

    TriggerRequest:
      type: object
      required:
        - jobName
        - requestedBy
      properties:
        jobName:
          type: string
        requestedBy:
          type: string

    TriggerAcceptedResponse:
      type: object
      required:
        - accepted
        - source
        - jobName
        - jobExecutionId
        - eventId
        - status
        - acceptedAtUtc
        - message
      properties:
        accepted:
          type: boolean
          enum: [true]
        source:
          type: string
          enum: [pact.api]
        jobName:
          type: string
        jobExecutionId:
          type: string
          description: Correlation ID as 32-char GUID without hyphens.
          example: f6ab2d5f8f6849d89b8b5ca73d4f0f17
        eventId:
          type: string
          description: EventBridge event ID or localproc-{pid} in local mode.
        status:
          type: string
          enum: [TriggerAccepted, WorkerProcessStarted]
        acceptedAtUtc:
          type: string
          format: date-time
        message:
          type: string
        workerPid:
          type: integer
          nullable: true
        workerProcessLaunched:
          type: boolean
          nullable: true

    BasicFailureResponse:
      type: object
      required:
        - accepted
        - reason
      properties:
        accepted:
          type: boolean
          enum: [false]
        source:
          type: string
          nullable: true
        jobName:
          type: string
          nullable: true
        reason:
          type: string

    CanRunResponse:
      type: object
      required:
        - jobName
        - canRun
        - sourceOfTruth
      properties:
        jobName:
          type: string
        canRun:
          type: boolean
        reason:
          type: string
          nullable: true
        activeLock:
          type: object
          nullable: true
          properties:
            jobQueueId:
              type: string
              format: uuid
            acquiredAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
            isActive:
              type: boolean
        sourceOfTruth:
          type: string
          enum: [BatchJobs]

    JobStatusResponse:
      type: object
      required:
        - jobName
        - isRunning
        - sourceOfTruth
      properties:
        jobName:
          type: string
        isRunning:
          type: boolean
        sourceOfTruth:
          type: string
          enum: [BatchJobs, StartupWatchdog]
        correlatedJobExecutionId:
          type: string
          nullable: true
        queryResolution:
          $ref: "#/components/schemas/QueryResolution"
        lastExecution:
          $ref: "#/components/schemas/LastExecution"
        startupWatchdog:
          $ref: "#/components/schemas/StartupWatchdog"
        diagnostics:
          type: object
          nullable: true

    QueryResolution:
      type: object
      required:
        - mode
        - isFallback
        - requestedJobExecutionIdIsValid
      properties:
        mode:
          type: string
          enum: [CorrelatedExecutionId, LatestByJobNameFallback]
        isFallback:
          type: boolean
        fallbackReason:
          type: string
          nullable: true
          enum: [MissingJobExecutionId, InvalidJobExecutionId, null]
        requestedJobExecutionId:
          type: string
          nullable: true
        requestedJobExecutionIdIsValid:
          type: boolean

    LastExecution:
      type: object
      nullable: true
      properties:
        executionId:
          type: string
          format: uuid
        jobName:
          type: string
        jobExecutionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [Pending, Running, Completed, Failed, Cancelled, Retry, Skipped]
        businessState:
          type: string
          nullable: true
          enum: [Running, Completed, Failed, Cancelled, Skipped, null]
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        durationSeconds:
          type: number
          format: double
          nullable: true
        recordsProcessed:
          type: integer
          nullable: true
        recordsFailed:
          type: integer
          nullable: true
        errorMessage:
          type: string
          nullable: true

    StartupWatchdog:
      type: object
      nullable: true
      properties:
        projectedState:
          type: string
          enum: [TriggerAccepted, WorkerProcessStarted, StartFailedTimeout, WorkerProcessExited, Completed, Cancelled, Skipped]
        acceptedAtUtc:
          type: string
          format: date-time
        startupDeadlineUtc:
          type: string
          format: date-time
        evaluatedAtUtc:
          type: string
          format: date-time
        startupSlaSeconds:
          type: integer
        deliveryExhaustionConfirmed:
          type: boolean
        deliveryExhaustionOwner:
          type: string
        eventId:
          type: string
        triggerStatus:
          type: string
        workerExitCode:
          type: integer
          nullable: true
        triggerStore:
          type: string

    CancelRequest:
      type: object
      required:
        - jobExecutionId
        - requestedBy
      properties:
        jobExecutionId:
          type: string
          format: uuid
        requestedBy:
          type: string

    CancelResponse:
      type: object
      required:
        - jobName
        - jobExecutionId
        - cancellationStatus
        - accepted
        - alreadyRequested
        - noOpTerminal
      properties:
        jobName:
          type: string
        jobExecutionId:
          type: string
          format: uuid
        cancellationStatus:
          type: string
          enum: [Accepted, AlreadyRequested, NoOpTerminal]
        accepted:
          type: boolean
        alreadyRequested:
          type: boolean
        noOpTerminal:
          type: boolean
        executionState:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    ProblemLikeResponse:
      type: object
      required:
        - title
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
        status:
          type: integer
          nullable: true
        detail:
          type: string
          nullable: true

tags:
  - name: Operational
    description: Health and liveness
  - name: Catalog
    description: Job routing catalog
  - name: Trigger
    description: Batch job trigger operations
  - name: Status
    description: Status and can-run endpoints
  - name: Cancel
    description: Cancellation endpoints
