version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: batch_jobs_postgres
    environment:
      POSTGRES_DB: batch_jobs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - batch_jobs_network

  batch-jobs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batch_jobs_app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DatabaseConnection__Server: postgres
      DatabaseConnection__Port: 5432
      DatabaseConnection__Database: batch_jobs_db
      DatabaseConnection__Username: postgres
      DatabaseConnection__Password: password
      DatabaseConnection__Timeout: 30
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - batch_jobs_network

volumes:
  postgres_data:
    driver: local

networks:
  batch_jobs_network:
    driver: bridge
