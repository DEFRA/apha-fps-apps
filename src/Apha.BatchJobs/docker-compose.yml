services:
  postgres:
    image: postgres:16-alpine
    container_name: batch_jobs_postgres
    profiles:
      - withdb
    environment:
      POSTGRES_DB: batch_jobs_foundation_db
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - batch_jobs_network

  batch-jobs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batch_jobs_app
    profiles:
      - withdb
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      BatchJobs__EnableDatabase: "true"
      ConnectionStrings__BatchJobsConnectionString: Host=postgres;Port=5432;Database=batch_jobs_foundation_db;Username=postgres;Password=password;Timeout=30
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - batch_jobs_network

  batch-jobs-nodb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batch_jobs_app_nodb
    profiles:
      - nodb
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      BATCHJOBS__ENABLEDATABASE: "false"
      ConnectionStrings__BatchJobsConnectionString: Host=localhost;Port=5432;Database=batch_jobs_foundation_db;Username=postgres;Timeout=30
      BATCH_JOB_NAME: HealthCheck
      BATCH_RUN_MODE: AdHoc
    networks:
      - batch_jobs_network

volumes:
  postgres_data:
    driver: local

networks:
  batch_jobs_network:
    driver: bridge
