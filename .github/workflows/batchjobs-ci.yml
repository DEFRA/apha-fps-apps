name: BatchJobs CI

on:
  push:
    branches: [main, feature-batchjobs, A-Foundation]
    paths:
      - 'src/Apha.BatchJobs/**'
      - '.github/workflows/batchjobs-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Apha.BatchJobs/**'

env:
  DOTNET_VERSION: '10.0.x'
  IMAGE_NAME: apha-batch-jobs
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: build + unit tests (no DB needed)
  # ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Apha.BatchJobs

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore BatchJobs.csproj

      - name: Build
        run: dotnet build BatchJobs.csproj --no-restore -c Release

      - name: Unit tests (no DB)
        run: |
          dotnet test Apha.BatchJobs.UnitTests/Apha.BatchJobs.UnitTests.csproj \
            --no-restore --filter "FullyQualifiedName!~RepositoryIntegrationTests" \
            -v minimal

  # ──────────────────────────────────────────────────────────────
  # Job 2: integration tests (Postgres service required)
  # ──────────────────────────────────────────────────────────────
  integration-tests:
    name: Repository Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: src/Apha.BatchJobs

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: batch_jobs_foundation_db
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore BatchJobs.csproj

      - name: Repository integration tests
        env:
          ConnectionStrings__BatchJobsConnectionString: >-
            Host=localhost;Port=5432;Database=batch_jobs_foundation_db;Username=postgres;Timeout=30
        run: |
          dotnet test Apha.BatchJobs.UnitTests/Apha.BatchJobs.UnitTests.csproj \
            --no-restore --filter "FullyQualifiedName~RepositoryIntegrationTests" \
            -v minimal

  # ──────────────────────────────────────────────────────────────
  # Job 3: docker build (every run) + ECR push (main only)
  # ──────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & ECR Push
    runs-on: ubuntu-latest
    needs: integration-tests
    defaults:
      run:
        working-directory: src/Apha.BatchJobs

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Tag and push to ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:latest \
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
