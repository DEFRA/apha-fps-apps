name: push image template
on:
  workflow_call:
    inputs:
      IMAGE_VERSION:
        required: false
        type: string
      repository:
         description: "docker repository name"
         required: true
         type: string
      dev_image_version_release:
        description: "dev image version release"
        required: true
        type: boolean
      environment:  
        description: "Optional environment name"
        required: false
        type: string  
      tag_short_description:   
        description: "Short description for the git tag"
        required: true
        type: string  
      dockerfile_path:
        description: "Relative path to the Dockerfile from repo root"
        required: true
        type: string
  
    secrets:
      AWS_ENV_REGION:
        required: true
      AWS_ENV_ACCOUNT:
        required: true
      AWS_ENV_ROLE:
        required: true

env:
  REPOSITORY: ${{ inputs.repository }}
  DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
jobs:
  push-image:
    name: Push Docker Image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || '' }} 
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Compose image tag
        id: imgtag
        shell: bash
        env:
          DEV_IMAGE_VERSION_RELEASE: ${{ inputs.dev_image_version_release }}
          DEV_IMAGE_VERSION: ${{ inputs.IMAGE_VERSION }}
        run: |
          # Derive short app name from repository input (e.g. "apha/fpsapps" -> "fpsapps")
          app_name="${REPOSITORY##*/}"

          if [ "$DEV_IMAGE_VERSION_RELEASE" = "false" ]; then
            git fetch --tags
            # Search backwards through rollout-v* tags to find the latest one that
            # includes this app (handles partial rollouts where not all apps are released)
            app_version=""
            for rollout_tag in $(git tag --list "rollout-v*" --sort=-version:refname); do
              app_version=$(git tag -l --format='%(contents)' "$rollout_tag" | grep "^${app_name}=" | cut -d= -f2 || true)
              if [ -n "$app_version" ]; then
                echo "Found version ${app_version} for ${app_name} in ${rollout_tag}"
                break
              fi
            done

            if [ -z "$app_version" ]; then
              app_version="0.0.0"
              echo "No rollout tag found for ${app_name}, defaulting to ${app_version}"
            fi

            sha="${GITHUB_SHA::8}"
            image_tag="v${app_version}-dev-${sha}"
            echo "image_tag = $image_tag"
          else
            image_tag="v$DEV_IMAGE_VERSION"
          fi
          echo "image_tag=$image_tag" >> $GITHUB_OUTPUT
      - name: Print Docker image tag
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.imgtag.outputs.image_tag }}
        run: |
          echo "Image Tag: $IMAGE_TAG"
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ secrets.AWS_ENV_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ENV_ACCOUNT }}:role/${{
            secrets.AWS_ENV_ROLE }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          flavor: |
            latest=false
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY }}
          tags: |
            type=semver,priority=900,pattern={{raw}}
            type=raw,priority=800,value=${{steps.imgtag.outputs.image_tag }}
          labels: |
            org.opencontainers.image.licenses=OGL-UK-3.0

      - name: Run container locally
        env:
          IMAGE_TAG: ${{ steps.imgtag.outputs.image_tag }}
        run: |
          docker build -t $REPOSITORY:$IMAGE_TAG --file $DOCKERFILE_PATH .
          echo "Running local image: $IMAGE_TAG"
          docker run -d --name test-container -p 8080:8080 -e ASPNETCORE_ENVIRONMENT=local $REPOSITORY:$IMAGE_TAG
      - name: Wait for service to start
        run: >
          echo "Waiting for the service to start..."

          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "000")
            echo "HTTP Status: $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "Service is healthy..."
              break
            fi
            echo "--- Last 5 log lines from container ---"
            docker logs test-container --tail 5 || true
            echo "---------------------------------------"
            sleep 3
          done
      - name: Test application response
        run: |
          curl -i http://localhost:8080/health
      - name: Cleanup container
        if: always()
        run: |
          docker rm -f test-container

      - name: Build and push Docker image manually
        env:
          IMAGE_TAG: ${{ steps.imgtag.outputs.image_tag }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          META_REVISION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          META_SOURCE: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.source'] }}
          META_TITLE: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.title'] }}
          META_VERSION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          META_CREATED: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          META_DESCRIPTION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.description'] }}
          META_LICENSES: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.licenses'] }}
        run: |
          IMAGE_NAME="$ECR_REGISTRY/$REPOSITORY"

          echo "Building Docker image $IMAGE_NAME:$IMAGE_TAG"
          docker build \
            --file $DOCKERFILE_PATH \
            --build-arg GIT_COMMIT="$META_REVISION" \
            --label org.opencontainers.image.source="$META_SOURCE" \
            --label org.opencontainers.image.revision="$META_REVISION" \
            --label org.opencontainers.image.title="$META_TITLE" \
            --label org.opencontainers.image.version="$META_VERSION" \
            --label org.opencontainers.image.created="$META_CREATED" \
            --label org.opencontainers.image.description="$META_DESCRIPTION" \
            --label org.opencontainers.image.licenses="$META_LICENSES" \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            .

          echo "Pushing Docker image..."
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Generate job summary
        id: summary
        env:
          IMAGE_TAG: ${{ steps.imgtag.outputs.image_tag }}
          META_CREATED: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          META_DESCRIPTION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.description'] }}
          META_LICENSES: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.licenses'] }}
          META_REVISION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          META_SOURCE: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.source'] }}
          META_TITLE: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.title'] }}
          META_URL: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.url'] }}
          META_VERSION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
        run: |
          {
            echo "### Docker Image details"
            echo "The tag is **$IMAGE_TAG**"
            echo "| Label      | Value |"
            echo "| ---------- | ----- |"
            echo "| created    | $META_CREATED |"
            echo "| description| $META_DESCRIPTION |"
            echo "| licenses   | $META_LICENSES |"
            echo "| revision   | $META_REVISION |"
            echo "| source     | $META_SOURCE |"
            echo "| title      | $META_TITLE |"
            echo "| url        | $META_URL |"
            echo "| version    | $META_VERSION |"
          } >> $GITHUB_STEP_SUMMARY

    
