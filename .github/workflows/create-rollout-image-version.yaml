name: All Apps - Create Rollout Image Version and Push ECR

on:
  workflow_dispatch:
    inputs:
      FPSAPPS_VERSION:
        description: 'FPSApps Web image version (leave blank to skip)'
        type: string
        required: false
      FPS_VERSION:
        description: 'FPS API image version (leave blank to skip)'
        type: string
        required: false
      COSTBOOK_VERSION:
        description: 'Costbook API image version (leave blank to skip)'
        type: string
        required: false
      PACT_VERSION:
        description: 'PACT API image version (leave blank to skip)'
        type: string
        required: false
      PIMS_VERSION:
        description: 'PIMS API image version (leave blank to skip)'
        type: string
        required: false
      tag_short_description:
        description: "Short description for the git tag (applied to all pushed images)"
        required: true
        type: string
      ROLLOUT_VERSION:
        description: 'Rollout version tag (e.g. 1.0.0) - used as the repo-level git tag'
        required: true
        type: string

permissions: {}   # disables all default permissions

concurrency:
  group: rollout-ecr-push
  cancel-in-progress: false   # never cancel an in-flight rollout

jobs:
  # ── Validate version inputs ──────────────────────────────────────────────────
  validate-inputs:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      needs_approval: ${{ steps.version-check.outputs.needs_approval }}
    steps:
      - name: Checkout to read git tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show current released versions from latest rollout tag
        shell: bash
        run: |
          git fetch --tags
          latest_rollout=$(git tag --list "rollout-v*" --sort=-version:refname | head -n 1 || echo "")
          if [ -z "$latest_rollout" ]; then
            echo "No previous rollout tags found. This appears to be the first rollout."
          else
            echo "========================================"
            echo " Current versions from: $latest_rollout"
            echo "========================================"
            git tag -l --format='%(contents)' "$latest_rollout" | grep -E '^(fpsapps|fps|costbook|pact|pims|version)=' || true
            echo "========================================"
          fi
      - name: Check for version downgrades or re-releases requiring approval
        id: version-check
        shell: bash
        env:
          FPSAPPS_VERSION: ${{ github.event.inputs.FPSAPPS_VERSION }}
          FPS_VERSION: ${{ github.event.inputs.FPS_VERSION }}
          COSTBOOK_VERSION: ${{ github.event.inputs.COSTBOOK_VERSION }}
          PACT_VERSION: ${{ github.event.inputs.PACT_VERSION }}
          PIMS_VERSION: ${{ github.event.inputs.PIMS_VERSION }}
        run: |
          latest_rollout=$(git tag --list "rollout-v*" --sort=-version:refname | head -n 1 || echo "")
          needs_approval=false

          if [ -n "$latest_rollout" ]; then
            # Returns 0 (true) if new_ver is less than or equal to current
            is_not_increment() {
              local app="$1"
              local new_ver="$2"
              local current
              current=$(git tag -l --format='%(contents)' "$latest_rollout" | grep "^${app}=" | cut -d= -f2)
              [ -z "$current" ] && return 1   # app not in previous rollout
              if [ "$new_ver" = "$current" ]; then
                echo "APPROVAL NEEDED: $app $new_ver is same as current ($current)"
                return 0
              fi
              local higher
              higher=$(printf '%s\n%s\n' "$current" "$new_ver" | sort -V | tail -n 1)
              if [ "$higher" != "$new_ver" ]; then
                echo "APPROVAL NEEDED: $app $new_ver is a downgrade from current ($current)"
                return 0
              fi
              echo "OK: $app $current -> $new_ver"
              return 1
            }

            [ -n "$FPSAPPS_VERSION" ] && is_not_increment "fpsapps"  "$FPSAPPS_VERSION" && needs_approval=true
            [ -n "$FPS_VERSION" ]      && is_not_increment "fps"       "$FPS_VERSION"      && needs_approval=true
            [ -n "$COSTBOOK_VERSION" ] && is_not_increment "costbook" "$COSTBOOK_VERSION" && needs_approval=true
            [ -n "$PACT_VERSION" ]     && is_not_increment "pact"      "$PACT_VERSION"     && needs_approval=true
            [ -n "$PIMS_VERSION" ]     && is_not_increment "pims"      "$PIMS_VERSION"     && needs_approval=true
          fi

          echo "needs_approval=$needs_approval" >> $GITHUB_OUTPUT
          if [ "$needs_approval" = "true" ]; then
            echo "One or more versions are a downgrade or re-release — awaiting reviewer approval."
          else
            echo "All versions are forward increments — no approval required."
          fi
      - name: Validate semver format (major.minor.patch) for all provided versions
        shell: bash
        env:
          FPSAPPS_VERSION: ${{ github.event.inputs.FPSAPPS_VERSION }}
          FPS_VERSION: ${{ github.event.inputs.FPS_VERSION }}
          COSTBOOK_VERSION: ${{ github.event.inputs.COSTBOOK_VERSION }}
          PACT_VERSION: ${{ github.event.inputs.PACT_VERSION }}
          PIMS_VERSION: ${{ github.event.inputs.PIMS_VERSION }}
          ROLLOUT_VERSION: ${{ github.event.inputs.ROLLOUT_VERSION }}
        run: |
          VERSION_REGEX='^[0-9]+\.[0-9]+\.[0-9]+$'
          errors=0
          check_version() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ] && ! [[ "$value" =~ $VERSION_REGEX ]]; then
              echo "ERROR: $name value '$value' is not valid semver. Expected format: major.minor.patch (e.g. 1.2.3)"
              errors=$((errors + 1))
            fi
          }
          check_version "FPSAPPS_VERSION" "$FPSAPPS_VERSION"
          check_version "FPS_VERSION"      "$FPS_VERSION"
          check_version "COSTBOOK_VERSION" "$COSTBOOK_VERSION"
          check_version "PACT_VERSION"     "$PACT_VERSION"
          check_version "PIMS_VERSION"     "$PIMS_VERSION"
          check_version "ROLLOUT_VERSION"  "$ROLLOUT_VERSION"
          if [ $errors -gt 0 ]; then
            echo "One or more version inputs failed validation. Aborting."
            exit 1
          fi
          # Ensure at least one app version has been provided
          if [ -z "$FPSAPPS_VERSION" ] && [ -z "$FPS_VERSION" ] && [ -z "$COSTBOOK_VERSION" ] && [ -z "$PACT_VERSION" ] && [ -z "$PIMS_VERSION" ]; then
            echo "ERROR: At least one app version must be provided. All inputs are blank."
            exit 1
          fi
          echo "All provided version inputs are valid."

  # ── Approval gate ─────────────────────────────────────────────────────────────
  # Pauses here and notifies reviewers. Reviewer can check the validate-inputs
  # job log to see current versions before approving.
  await-approval:
    needs: validate-inputs
    if: needs.validate-inputs.outputs.needs_approval == 'true'
    runs-on: ubuntu-latest
    environment: rollout-approval   # requires reviewers configured in repo Settings → Environments
    permissions: {}
    steps:
      - name: Approval granted — proceeding with rollout
        run: echo "Rollout approved. Starting builds."

  # ── FPSApps Web ──────────────────────────────────────────────────────────────
  build-sonar-fpsapps:
    needs: [validate-inputs, await-approval]
    if: always() && needs.validate-inputs.result == 'success' && (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped') && github.event.inputs.FPSAPPS_VERSION != ''
    uses: ./.github/workflows/build-and-sonar-analyze-template.yaml
    with:
      dotnet_application_solution_name: Apha.FPSApps
      sonar_project_key: DEFRA_apha-fps-apps
      solution_file: Apha.FPSApps.Web
      run_application_tests: true
      run_web_tests: true
      web_layer_suffix: 'Web'
      run_infrastructure_tests: true
      environment: rollout
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      id-token: write
      contents: read

  push-fpsapps:
    needs: build-sonar-fpsapps
    if: always() && needs.build-sonar-fpsapps.result == 'success' && github.event.inputs.FPSAPPS_VERSION != ''
    uses: ./.github/workflows/push-image-template.yaml
    with:
      IMAGE_VERSION: ${{ github.event.inputs.FPSAPPS_VERSION }}
      repository: apha/fpsapps
      dockerfile_path: src/Apha.FPSApps/Dockerfile
      dev_image_version_release: true
      tag_short_description: ${{ github.event.inputs.tag_short_description }}
    secrets:
      AWS_ENV_REGION: ${{ secrets.AWS_ENV_REGION }}
      AWS_ENV_ACCOUNT: ${{ secrets.AWS_ENV_ACCOUNT }}
      AWS_ENV_ROLE: ${{ secrets.AWS_ENV_ROLE }}
    permissions:
      id-token: write
      contents: write

  # ── FPS API ───────────────────────────────────────────────────────────────────
  build-sonar-fps:
    needs: [validate-inputs, await-approval]
    if: always() && needs.validate-inputs.result == 'success' && (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped') && github.event.inputs.FPS_VERSION != ''
    uses: ./.github/workflows/build-and-sonar-analyze-template.yaml
    with:
      dotnet_application_solution_name: Apha.FPS
      sonar_project_key: DEFRA_apha-fps-apps
      solution_file: Apha.FPS.Api
      run_application_tests: true
      run_web_tests: true
      web_layer_suffix: 'Api'
      run_dataaccess_tests: true
      environment: rollout
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      id-token: write
      contents: read

  push-fps:
    needs: build-sonar-fps
    if: always() && needs.build-sonar-fps.result == 'success' && github.event.inputs.FPS_VERSION != ''
    uses: ./.github/workflows/push-image-template.yaml
    with:
      IMAGE_VERSION: ${{ github.event.inputs.FPS_VERSION }}
      repository: apha/fps
      dockerfile_path: src/Apha.FPS/Dockerfile
      dev_image_version_release: true
      tag_short_description: ${{ github.event.inputs.tag_short_description }}
    secrets:
      AWS_ENV_REGION: ${{ secrets.AWS_ENV_REGION }}
      AWS_ENV_ACCOUNT: ${{ secrets.AWS_ENV_ACCOUNT }}
      AWS_ENV_ROLE: ${{ secrets.AWS_ENV_ROLE }}
    permissions:
      id-token: write
      contents: write

  # ── Costbook API ──────────────────────────────────────────────────────────────
  build-sonar-costbook:
    needs: [validate-inputs, await-approval]
    if: always() && needs.validate-inputs.result == 'success' && (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped') && github.event.inputs.COSTBOOK_VERSION != ''
    uses: ./.github/workflows/build-and-sonar-analyze-template.yaml
    with:
      dotnet_application_solution_name: Apha.Costbook
      sonar_project_key: DEFRA_apha-fps-apps
      solution_file: Apha.Costbook.Api
      run_application_tests: true
      run_web_tests: true
      web_layer_suffix: 'Api'
      run_dataaccess_tests: true
      environment: rollout
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      id-token: write
      contents: read

  push-costbook:
    needs: build-sonar-costbook
    if: always() && needs.build-sonar-costbook.result == 'success' && github.event.inputs.COSTBOOK_VERSION != ''
    uses: ./.github/workflows/push-image-template.yaml
    with:
      IMAGE_VERSION: ${{ github.event.inputs.COSTBOOK_VERSION }}
      repository: apha/costbook
      dockerfile_path: src/Apha.Costbook/Dockerfile
      dev_image_version_release: true
      tag_short_description: ${{ github.event.inputs.tag_short_description }}
    secrets:
      AWS_ENV_REGION: ${{ secrets.AWS_ENV_REGION }}
      AWS_ENV_ACCOUNT: ${{ secrets.AWS_ENV_ACCOUNT }}
      AWS_ENV_ROLE: ${{ secrets.AWS_ENV_ROLE }}
    permissions:
      id-token: write
      contents: write

  # ── PACT API ──────────────────────────────────────────────────────────────────
  build-sonar-pact:
    needs: [validate-inputs, await-approval]
    if: always() && needs.validate-inputs.result == 'success' && (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped') && github.event.inputs.PACT_VERSION != ''
    uses: ./.github/workflows/build-and-sonar-analyze-template.yaml
    with:
      dotnet_application_solution_name: Apha.PACT
      sonar_project_key: DEFRA_apha-fps-apps
      solution_file: Apha.PACT.Api
      run_application_tests: true
      run_web_tests: true
      web_layer_suffix: 'Api'
      run_dataaccess_tests: true
      environment: rollout
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      id-token: write
      contents: read

  push-pact:
    needs: build-sonar-pact
    if: always() && needs.build-sonar-pact.result == 'success' && github.event.inputs.PACT_VERSION != ''
    uses: ./.github/workflows/push-image-template.yaml
    with:
      IMAGE_VERSION: ${{ github.event.inputs.PACT_VERSION }}
      repository: apha/pact
      dockerfile_path: src/Apha.PACT/Dockerfile
      dev_image_version_release: true
      tag_short_description: ${{ github.event.inputs.tag_short_description }}
    secrets:
      AWS_ENV_REGION: ${{ secrets.AWS_ENV_REGION }}
      AWS_ENV_ACCOUNT: ${{ secrets.AWS_ENV_ACCOUNT }}
      AWS_ENV_ROLE: ${{ secrets.AWS_ENV_ROLE }}
    permissions:
      id-token: write
      contents: write

  # ── PIMS API ──────────────────────────────────────────────────────────────────
  build-sonar-pims:
    needs: [validate-inputs, await-approval]
    if: always() && needs.validate-inputs.result == 'success' && (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped') && github.event.inputs.PIMS_VERSION != ''
    uses: ./.github/workflows/build-and-sonar-analyze-template.yaml
    with:
      dotnet_application_solution_name: Apha.PIMS
      sonar_project_key: DEFRA_apha-fps-apps
      solution_file: Apha.PIMS.Api
      run_application_tests: false
      run_web_tests: false
      web_layer_suffix: 'Api'
      run_dataaccess_tests: false
      environment: rollout
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      id-token: write
      contents: read

  push-pims:
    needs: build-sonar-pims
    if: always() && needs.build-sonar-pims.result == 'success' && github.event.inputs.PIMS_VERSION != ''
    uses: ./.github/workflows/push-image-template.yaml
    with:
      IMAGE_VERSION: ${{ github.event.inputs.PIMS_VERSION }}
      repository: apha/pims
      dockerfile_path: src/Apha.PIMS/Dockerfile
      dev_image_version_release: true
      tag_short_description: ${{ github.event.inputs.tag_short_description }}
    secrets:
      AWS_ENV_REGION: ${{ secrets.AWS_ENV_REGION }}
      AWS_ENV_ACCOUNT: ${{ secrets.AWS_ENV_ACCOUNT }}
      AWS_ENV_ROLE: ${{ secrets.AWS_ENV_ROLE }}
    permissions:
      id-token: write
      contents: write

  # ── Single repo-level git tag for the whole rollout ───────────────────────────
  create-rollout-git-tag:
    needs: [push-fpsapps, push-fps, push-costbook, push-pact, push-pims]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Create and push rollout git tag
        env:
          TAG_MESSAGE: ${{ github.event.inputs.tag_short_description }}
          ROLLOUT_VERSION: ${{ github.event.inputs.ROLLOUT_VERSION }}
          FPSAPPS_VERSION: ${{ github.event.inputs.FPSAPPS_VERSION }}
          FPS_VERSION: ${{ github.event.inputs.FPS_VERSION }}
          COSTBOOK_VERSION: ${{ github.event.inputs.COSTBOOK_VERSION }}
          PACT_VERSION: ${{ github.event.inputs.PACT_VERSION }}
          PIMS_VERSION: ${{ github.event.inputs.PIMS_VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          GIT_TAG="rollout-v${ROLLOUT_VERSION}"

          # Structured key=value annotation — machine-readable by dev builds
          ANNOTATION="${TAG_MESSAGE}\n\n[rollout]\nversion=${ROLLOUT_VERSION}"
          [ -n "$FPSAPPS_VERSION" ]  && ANNOTATION+="\nfpsapps=${FPSAPPS_VERSION}"
          [ -n "$FPS_VERSION" ]       && ANNOTATION+="\nfps=${FPS_VERSION}"
          [ -n "$COSTBOOK_VERSION" ]  && ANNOTATION+="\ncostbook=${COSTBOOK_VERSION}"
          [ -n "$PACT_VERSION" ]      && ANNOTATION+="\npact=${PACT_VERSION}"
          [ -n "$PIMS_VERSION" ]      && ANNOTATION+="\npims=${PIMS_VERSION}"

          echo "Creating rollout tag: $GIT_TAG"
          echo -e "Tag annotation:\n$ANNOTATION"

          if git ls-remote --tags origin | grep -q "refs/tags/${GIT_TAG}"; then
            echo "Tag ${GIT_TAG} already exists. Aborting."
            exit 1
          fi

          git tag -a "$GIT_TAG" -m "$(echo -e "$ANNOTATION")"
          git push origin "$GIT_TAG"
          echo "Tag ${GIT_TAG} pushed successfully."
